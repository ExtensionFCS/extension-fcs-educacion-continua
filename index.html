<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educación continua · FCS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F1D2B;--ink2:#4A4766;--line:#DAD7EC;--bg:#F6F5FB;--acc:#4B44A3;--acc2:#7F77DD;--accsoft:#EDEBFA}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:10px 28px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--acc2);display:inline-block}
.nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.tab{padding:0 14px;border-radius:8px;font-size:15px;color:#3A3752;min-height:44px;display:flex;align-items:center}
.tab:hover{text-decoration:none;background:#F3F2FA}
.tab.on{background:var(--accsoft);color:#3F3890;font-weight:700}
.who{font-size:14px;color:#3A3752;display:flex;align-items:center;gap:12px}
.wrap{max-width:1296px;margin:0 auto;padding:24px 28px 56px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.two{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.two>*{flex:1 1 380px;min-width:0}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.v{background:#E3F4EC;color:#175F42}.a{background:#FFD166;color:#1F1D2B}.r{background:#FDE7E5;color:#A3201A}.g{background:#ECEBF2;color:#3A3752}.p{background:var(--accsoft);color:#3F3890}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid #B9B4E4;background:#fff;color:#3F3890;border-radius:999px;padding:0 16px;min-height:44px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;border:1px solid var(--acc);cursor:pointer}
.btn:hover{text-decoration:none}.btn.sec{background:#fff;color:#3F3890;border-color:#B9B4E4}.btn:disabled{opacity:.55;cursor:not-allowed}
label{font-size:13px;color:var(--ink2);display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:44px;font-size:14px;padding:0 10px;border:1px solid #B9B4E4;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:76px;padding:10px}
input[type=checkbox]{width:auto;min-height:0}
.f{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 18px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid #EEECF6;vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.row{padding:10px 0;border-top:1px solid #EEECF6;font-size:14px}.row small,.sm{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.note{font-size:13px;color:var(--ink2);margin:0 0 10px}
.big{font-size:38px;font-weight:700;line-height:1;color:#3F3890}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.t{background:none;border:0;padding:0 16px;font-weight:500;color:#3A3752;min-height:44px;cursor:pointer;border-bottom:3px solid transparent}
.t.on{color:#3F3890;font-weight:700;border-bottom-color:var(--acc2)}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font-size:13px;color:var(--ink2)}
.step b{display:block;font-size:14px;margin-top:2px;color:var(--ink)}
.step.done{background:var(--accsoft)}.step.cur{border:2px solid var(--acc)}
.bar{height:10px;border-radius:6px;background:#E6E3F5;overflow:hidden;margin:10px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.flash{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;font-weight:500}
.flash.ok{background:#E3F4EC;color:#175F42}.flash.err{background:#FDE7E5;color:#A3201A}
.rowc{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,2fr) minmax(0,2.3fr) minmax(0,.7fr);gap:10px;align-items:center;padding:3px 10px;border-bottom:1px solid #EEECF6;font-size:14px;min-width:820px}
.rowc.h{font-size:12px;font-weight:700;color:var(--ink2)}.rowc.maribel{background:#F3F2F8}
.obs{min-height:36px;font-size:13px}
.opts{display:inline-flex;border:1px solid #B9B4E4;border-radius:8px;overflow:hidden}
.opts button{border:0;background:#fff;padding:0 12px;min-height:36px;font-size:13px;cursor:pointer;color:#3A3752}
.opts button.c{background:#175F42;color:#fff;font-weight:700}.opts button.p{background:#FFB020;color:#1F1D2B;font-weight:700}.opts button.n{background:#3A3752;color:#fff;font-weight:700}
.mv{display:inline-flex;gap:4px}.mv button{min-height:36px;min-width:36px;border:1px solid #B9B4E4;background:#fff;border-radius:8px;cursor:pointer;color:#3F3890}
.login{max-width:420px;margin:12vh auto 0;padding:0 20px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}summary{cursor:pointer;min-height:32px;display:flex;align-items:center;font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.pin{background:#F3F2FA;border-color:#B9B4E4}
.pill.o{background:#FF8A1F;color:#1F1D2B}
.pill.sr{background:#D32F2F;color:#fff}
.pill.sa{background:#FFC400;color:#1F1D2B}
.pill.pd{background:#fff;color:#3F3890;border:1px solid #8E88C9;font-weight:500}
.dona{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.leg{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);text-align:left;min-height:36px}.leg:hover{background:#F3F2FA}.leg small{color:var(--ink2);margin-left:auto}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.aten{display:flex;align-items:baseline;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;text-align:left;color:var(--ink);min-height:56px}.aten:hover{border-color:var(--acc)}.aten .n{font-size:30px;font-weight:700;color:#3F3890;line-height:1}.aten small{color:var(--ink2);font-size:13px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px;align-items:end;margin-bottom:10px}.filtros .f{margin:0}
.checks2{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:12px}.checks2 label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.gh{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#F8F7FD;border-radius:10px;padding:10px 14px;margin-top:8px;cursor:pointer;font-size:15px;color:var(--ink);min-height:44px;text-align:left}.gh:hover{border-color:var(--acc)}
.gh .car{color:var(--acc);width:14px}.gh .cnt{margin-left:auto;color:var(--ink2);font-size:13px}.gh .chs{display:flex;gap:6px;flex-wrap:wrap}
.orow{display:flex;gap:12px;align-items:center;padding:8px 6px;border-bottom:1px solid #EEECF6}
.fchip{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--accsoft);padding:6px 0}.fchip b{display:block;font-size:20px;line-height:1.1;color:#3F3890}.fchip span{font-size:11px;text-transform:uppercase;color:var(--ink2)}.fchip.sinf{background:#F0EFF6}.fchip.sinf b{color:var(--ink2)}
.otxt{flex:1;min-width:0}.otxt a{font-weight:500}.otxt small{display:block;color:var(--ink2);font-size:13px;margin-top:1px}
.obad{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.prox{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #EEECF6;font-size:14px}.prox small{display:block;color:var(--ink2);font-size:13px}
.lim{max-height:340px;overflow-y:auto}
.cal{min-width:900px}.calh,.calw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calh{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}.calw{margin-bottom:6px}
.cell{min-height:110px;border:1px solid #E3E0F2;border-radius:8px;padding:6px;background:#fff;font-size:12px}.cell.vacia{background:var(--bg);border-style:dashed}.cell.hoy{border:2px solid var(--acc)}.cell.fest{background:#F3F2F8}
.cell .n{font-weight:700;font-size:13px;margin-bottom:4px}
.evc{display:block;border-radius:5px;padding:3px 5px;margin-top:3px;line-height:1.25;color:#fff;font-weight:500}.evc:hover{text-decoration:none;filter:brightness(1.12)}
.evf{display:block;border-radius:5px;padding:3px 5px;margin-top:3px;background:#ECEBF2;color:#3A3752;font-style:italic}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-bottom:14px}.leyenda span{padding:4px 10px;border-radius:5px;color:#fff;font-weight:500}
.loading{padding:60px 20px;text-align:center;color:var(--ink2)}
/* ===== Ajustes: Inicio con semáforo visual, tareas, calendario con apoyos ===== */
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chead{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.bdg{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;margin-left:6px;text-align:center;line-height:1.5}
.bdg.r{background:#D32F2F}
.btn .bdg{background:#fff;color:#A3201A}
.t-r,.p-r{--c:#D32F2F;--bg:#FDECEA;--t:#fff}
.t-o,.p-o{--c:#FF8A1F;--bg:#FFF1E3;--t:#1F1D2B}
.t-a,.p-a{--c:#FFC400;--bg:#FFF8DB;--t:#1F1D2B}
.t-v,.p-v{--c:#1E7B57;--bg:#EAF6F0;--t:#fff}
.sem4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0 8px}
.stile{border:0;border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-height:84px;background:var(--c);color:var(--t);display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.stile .n{font-size:32px;font-weight:700;line-height:1}
.stile small{font-size:12px;font-weight:700}
.stile.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
.stile.off{opacity:.4}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:0 0 6px}
.sbar i{display:block;background:var(--c)}
.prow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;margin-top:8px;background:var(--bg);border-left:8px solid var(--c)}
.pdias{flex:none;width:56px;height:56px;border-radius:10px;background:var(--c);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pdias b{font-size:22px}.pdias span{font-size:11px;font-weight:700;margin-top:2px}
.pbar{height:6px;border-radius:4px;background:rgba(31,29,43,.12);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c)}
.pill.pri{background:#1F1D2B;color:#FFC400}
.pill.cert{background:#E3F4EC;color:#175F42}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;margin-top:8px;background:#fff;border:1px solid var(--line);border-left:8px solid var(--c,#8E88C9)}
.tk-venc{--c:#D32F2F;background:#FDECEA}
.tk-hoy,.tk-p3{--c:#FF8A1F;background:#FFF1E3}
.tk-sem{--c:#FFC400;background:#FFF8DB}
.tk-luego,.tk-sin{--c:#8E88C9}
.tk-hecha{--c:#1E7B57;opacity:.75}
.tchk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid #8E88C9;background:#fff;cursor:pointer;font-size:20px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.tchk:hover{border-color:var(--acc)}
.tchk.on{background:#1E7B57;border-color:#1E7B57}
.tdue{flex:none;text-align:right;min-width:120px}
.tdue small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.tact{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tact .btn{min-height:36px;padding:0 10px;font-size:13px}
.tact input[type=date]{min-height:36px;width:150px;font-size:13px}
@media(max-width:700px){.trow{flex-wrap:wrap}.tdue,.tact{text-align:left;align-items:flex-start}}
.aps{display:inline-flex;margin-left:4px;vertical-align:middle}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.ap{display:inline-flex;width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;font-style:normal;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;margin-left:2px;box-sizing:content-box;line-height:1}
/* ===== Espectro limpio, anillos, vista de líder, liquidación y recorrido ===== */
.btn.q{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn.q .bdg{background:#E5242F;color:#fff}
.sp-r{--c:#E5242F;--t:#FDECEE;--tx:#B01822;--bd:#F4A9AE;--trk:#FBD5D8}
.sp-o{--c:#FF8A00;--t:#FFF0DB;--tx:#8F4A00;--bd:#FFD099;--trk:#FFE3BF}
.sp-a{--c:#FFC400;--t:#FFF6D1;--tx:#6B5000;--bd:#FFE27A;--trk:#FFF0B3}
.sp-v{--c:#1DB46E;--t:#E3F6EC;--tx:#0E6B3F;--bd:#A8E3C4;--trk:#CDEFDD}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.fch{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--bd);background:var(--t);color:var(--tx);font-size:13px;font-weight:700;cursor:pointer}
.fch i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.fch.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}.fch.off{opacity:.5}
.rrow{display:flex;gap:20px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.rrow.crit{background:#FDECEE;border:1.5px solid #F4A9AE;border-radius:14px;margin-bottom:6px}
.rrow .nm{font-size:16px;font-weight:500}.rrow.crit .nm{font-weight:700}
.rrow svg{flex:none}
.pc{flex:none;border:1px solid #CFCBE6;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink2);background:#fff;white-space:nowrap}
.rrow.crit .pc{border-color:#E58A90;color:#B01822;font-weight:700}
@media(max-width:600px){.rrow{gap:12px;padding:12px 8px}}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.eqc{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;background:#fff}.eqc.tr{background:#FAFAFE}
.eqh{display:flex;align-items:center;gap:12px}.eqh b{font-size:16px;display:block}.eqh small{display:block;font-size:12px;color:var(--ink2)}
.eqa{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.eqbar{display:flex;height:8px;gap:3px}.eqbar i{display:block;border-radius:4px}
.eqlg{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2)}
.eqf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}.eqf a{display:inline-block;margin-right:12px;min-height:28px}
.grid2b{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start;margin-bottom:16px}
.rv{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.rv .btn{min-height:44px}
.rvd{width:12px;height:12px;border-radius:50%;flex:none}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.mt{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.mt small{display:block;font-size:12px;color:var(--ink2)}.mt b{display:block;font-size:22px;margin-top:4px;line-height:1.15}
.mbar{display:flex;height:16px;border-radius:8px;background:var(--accsoft);overflow:hidden;gap:2px}.mbar i{display:block}
.hatch{background:repeating-linear-gradient(135deg,#9A8FF0,#9A8FF0 4px,#CFCBE6 4px,#CFCBE6 8px)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.area{border-top:5px solid var(--acc);display:flex;flex-direction:column;gap:14px}.area.pr{border-top-color:#0F9B8E}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st3>div{border-radius:12px;padding:12px;background:var(--bg)}.st3 b{display:block;font-size:26px;line-height:1.1}.st3 small{font-size:12px}
.evc2{display:flex;flex-direction:column;gap:5px;border-radius:8px;padding:7px 7px 8px;margin-top:5px;color:#fff;font-weight:500}.evc2:hover{text-decoration:none;filter:brightness(1.1)}
.evc2 .evt{font-size:12px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.evc2 .evl{font-size:11px;opacity:.92}
.evc2 .evh{font-size:10px;font-weight:700;letter-spacing:.05em;border-top:1px solid rgba(255,255,255,.35);padding-top:5px;opacity:.92}
.evc2 .evp{display:flex;flex-direction:column;gap:4px}
.evc2.ap{background:#fff;color:var(--ink)}.evc2.ap .evh{border-top-color:var(--line);color:var(--ink2)}
.apn{display:flex;align-items:center;gap:5px;background:#fff;color:#1F1D2B;border:1px solid #DAD7EC;border-radius:999px;padding:2px 8px 2px 5px;font-size:11px;font-weight:600}.apn i{width:9px;height:9px;border-radius:50%;flex:none}
.opts button.on{background:var(--acc);color:#fff;font-weight:700}
.ag{display:flex;gap:16px;align-items:stretch;margin-bottom:10px}
.agd{width:64px;flex:none;text-align:center;padding-top:6px}.agd b{display:block;font-size:28px;line-height:1.1}.agd span{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.agc{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.agk{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.agk .tt{font-size:16px;font-weight:600}.agr{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12px;color:var(--ink2)}
.agr .lid{background:var(--c);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.agr .apy{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

<body>
<!-- PORTAL: EDUCACION CONTINUA -->
<div id="app"></div>
<div id="diag" aria-hidden="true" style="position:fixed;right:10px;bottom:6px;font-size:11px;color:#6B6890;z-index:40"></div>
<div id="red" role="status" aria-live="polite" style="display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1F1D2B;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:92vw;text-align:center"></div>
<script>
'use strict';
const URL_SERVIDOR = 'https://script.google.com/macros/s/AKfycbyV-5Wpb6Bsoi9X5j4JFKgfX43810C9dxOBZi3q_bzfJE7MDU587ame144utMoHn8boOQ/exec';

/* ---------- estado ---------- */
const S = { token: '', persona: null, cat: null, inicio: null, ficha: null, fichaId: '', tab: 'datos', flash: null, filtroTipo: 'Todas', buscar: '', soloAlerta: false, verArchivadas: false, usuarios: null, usuariosFrescos: false, ultimoUsuario: '', mesCal: '', precargado: false, soloPend: false, verProx: false, abiertos: {}, fx: null };
try { S.token = sessionStorage.getItem('ec_token') || ''; } catch (e) { S.token = ''; }
if (S.token) restaurarCache();

/* ---------- utilidades ---------- */
const app = document.getElementById('app');
const esc = (s) => String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const ETQ = {
  'Ideacion': 'Ideación', 'Negociacion': 'Negociación', 'En diseno': 'En diseño', 'Ejecucion': 'Ejecución', 'En ejecucion': 'En ejecución',
  'Programacion': 'Programación', 'Piezas / Difusion': 'Piezas / Difusión', 'Informe de liquidacion': 'Informe de liquidación',
  'Requerimientos comunicacion': 'Requerimientos comunicación', 'Cafe y agua': 'Café y agua',
  'Envio de requerimientos y seguridad': 'Envío de requerimientos y seguridad', 'Condicion': 'Condición', 'Observacion': 'Observación',
  'Coordinacion': 'Coordinación', 'No alcanzo el punto de equilibrio': 'No alcanzó el punto de equilibrio', 'Sin negociacion': 'Sin negociación',
  'Equipo de Educacion continua': 'Equipo de Educación continua', 'Asistente de Extension': 'Asistente de Extensión',
  'Pasantia': 'Pasantía', 'Publico': 'Público', 'Motivo de la cancelacion': 'Motivo de la cancelación',
  'Ano Nuevo': 'Año Nuevo', 'San Jose': 'San José', 'Dia del Trabajo': 'Día del Trabajo', 'Ascension del Senor': 'Ascensión del Señor', 'Sagrado Corazon': 'Sagrado Corazón',
  'Batalla de Boyaca': 'Batalla de Boyacá', 'Asuncion de la Virgen': 'Asunción de la Virgen', 'Dia de la Raza': 'Día de la Raza', 'Inmaculada Concepcion': 'Inmaculada Concepción'
};
const t = (x) => ETQ[x] || x;
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fecha(f) {
  if (!f || !/^\d{4}-\d{2}-\d{2}/.test(f)) return '—';
  const p = f.slice(0, 10).split('-');
  return Number(p[2]) + ' ' + MESES[Number(p[1]) - 1] + ' ' + p[0];
}
function fechaHora(f) {
  if (!f) return '';
  return fecha(f) + (f.length > 10 ? ' · ' + f.slice(11, 16) : '');
}
const SEM = { verde: ['v', 'Verde'], amarillo: ['sa', 'Amarillo'], rojo: ['sr', 'Rojo'], gris: ['g', 'Cerrada'], sin_fecha: ['g', 'Sin fecha'], pendiente: ['pd', 'Por definir'] };
const semPill = (c, motivo) => { const x = SEM[c] || ['g', '—']; const txt = (c === 'gris' && motivo) ? motivo : x[1]; return '<span class="pill ' + x[0] + '" title="' + esc(motivo || '') + '">' + esc(txt) + '</span>'; };
const TIPOS_EVENTO = ['Evento', 'Congreso', 'Simposio', 'Foro', 'Concurso'];
const pendTxt = (arr) => arr.map(t).join(', ');
const pill = (cls, txt) => '<span class="pill ' + cls + '">' + esc(txt) + '</span>';
const nombrePersona = (id) => { const p = S.cat && S.cat.personas.filter((x) => x.id === id)[0]; return p ? p.nombre : id; };
const primerNombre = (id) => nombrePersona(id).split(' ')[0];
const opcion = (v, txt, sel) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(txt) + '</option>';
const campo = (id, etiqueta, valor, tipo, extra) => '<div class="f"><label for="' + id + '">' + esc(etiqueta) + '</label><input id="' + id + '" type="' + (tipo || 'text') + '" value="' + esc(valor) + '" ' + (extra || '') + '></div>';
const val = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };
const flash = (tipo, msg) => { S.flash = { tipo, msg }; };

/* ---------- servidor ---------- */
let pendientes = 0; let avisoT = null; let msgRed = ''; let enVuelo = 0;
const LECTURAS = ['usuarios', 'sesion', 'catalogo', 'inicio', 'ficha', 'login', 'facturacion', 'tareas', 'metaAnual', 'liquidacion', 'configuracion', 'anios'];
const pausa = (ms) => new Promise((r) => setTimeout(r, ms));
function mostrarRed() {
  const e = document.getElementById('red'); if (!e) return;
  if (pendientes > 0) { e.textContent = msgRed || 'Conectando con el servidor… puede tardar hasta un minuto. No cierres la página.'; e.style.display = 'block'; }
  else e.style.display = 'none';
}
const ESPERADO = { usuarios: 'usuarios', sesion: 'persona', catalogo: 'personas', inicio: 'ofertas', ficha: 'oferta', login: 'token', crearOferta: 'id', guardarOferta: null, cambiarEstado: 'ficha', confirmarEstado: 'ficha', aplazar: 'ficha', reactivar: 'ficha', guardarItem: 'checklist', agregarItem: 'checklist', moverItem: 'checklist', agregarNota: 'notas', archivarNota: 'notas', agregarOpinion: 'opiniones', facturacion: 'docentes', guardarDocente: 'docente', guardarContrato: 'contrato', eliminarContrato: 'eliminado', tareas: 'tareas', crearTarea: 'tarea', actualizarTarea: 'tarea', eliminarTarea: 'eliminado', liquidacion: 'liquidacion', guardarLiquidacion: 'liquidacion', aprobarLiquidacion: 'liquidacion', devolverLiquidacion: 'liquidacion', metaAnual: 'meta', guardarMeta: 'meta', configuracion: 'secciones', guardarConfiguracion: 'secciones', anios: 'anios', habilitarAnio: 'anios', archivarAnio: 'anios', desarchivarAnio: 'anios' };
async function enviar(accion, datos, limite) {
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), limite || 90000);
  try {
    const r = await fetch(URL_SERVIDOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ accion, token: S.token }, datos || {})), signal: ctl.signal });
    const txt = await r.text();
    let j = null;
    try { j = JSON.parse(txt); } catch (e) { j = null; }
    const tot = performance.now() - t0;
    if (j !== null && typeof j.ms === 'number') { const d = document.getElementById('diag'); if (d) d.textContent = accion + ': ' + (tot / 1000).toFixed(1) + ' s en total · servidor ' + (j.ms / 1000).toFixed(1) + ' s · Google/red ' + Math.max(0, (tot - j.ms) / 1000).toFixed(1) + ' s'; }
    if (j === null || typeof j !== 'object') { const err = new Error('Google devolvió una página de error en lugar de los datos.'); err.transitorio = true; err.html = true; throw err; }
    /* Una respuesta buena trae el dato que la acción pide. Si falta (o es el saludo del servidor), Google contestó con otra cosa. */
    if (j.ok === true && (j.servicio !== undefined || (ESPERADO[accion] && j[ESPERADO[accion]] === undefined))) { const err = new Error('Google contestó con una respuesta que no es del sistema.'); err.transitorio = true; err.html = true; throw err; }
    if (!j.ok) {
      if (j.codigo === 'SESION') cerrarLocal();
      const err = new Error(j.error || 'Ocurrió un error.');
      err.codigo = j.codigo;
      throw err;
    }
    return j;
  } catch (e) {
    if (e.name === 'AbortError') { const err = new Error(limite ? 'Google tardó demasiado en responder.' : 'El servidor tardó demasiado en responder. Intenta de nuevo en un rato.'); err.transitorio = !!limite; err.tardo = true; throw err; }
    if (e instanceof TypeError) { const err = new Error('No se pudo conectar con el servidor. Revisa tu conexión e intenta de nuevo.'); err.transitorio = true; throw err; }
    throw e;
  } finally { clearTimeout(timer); }
}
/** Lecturas: si Google tarda o contesta mal, se cortan pronto y se repiten (casi siempre la repetición responde en segundos). Escrituras: una sola vez. */
const LIMITES_LECTURA = [15000, 20000, 40000];
async function api(accion, datos) {
  const esLectura = LECTURAS.indexOf(accion) >= 0;
  const intentos = esLectura ? 3 : 1;
  pendientes += 1;
  if (pendientes === 1) { msgRed = esLectura ? '' : 'Guardando… no cierres la página.'; clearTimeout(avisoT); avisoT = setTimeout(mostrarRed, esLectura ? 2000 : 500); }
  try {
    for (let n = 1; n <= intentos; n++) {
      try { return await enviar(accion, datos, esLectura ? LIMITES_LECTURA[n - 1] : 90000); }
      catch (e) {
        if (!e.transitorio) throw e;
        if (n < intentos) { msgRed = 'Google respondió lento o con un error pasajero. Reintentando (' + (n + 1) + ' de ' + intentos + ')…'; mostrarRed(); await pausa(n === 1 ? 300 : 1500); continue; }
        if (esLectura) throw new Error(e.html ? 'Google devolvió una respuesta equivocada en las tres pruebas. Suele ser pasajero: pulsa Reintentar en un momento.' : (e.tardo ? 'Google tardó demasiado en responder. Pulsa Reintentar.' : e.message));
        throw new Error('No se pudo confirmar si el cambio quedó guardado. Recarga la ficha y revisa el historial antes de repetirlo.');
      }
    }
  } finally {
    pendientes -= 1;
    if (pendientes <= 0) { pendientes = 0; clearTimeout(avisoT); msgRed = ''; mostrarRed(); }
  }
}
function cerrarLocal() {
  S.token = ''; S.persona = null; S.cat = null; S.inicio = null; S.ficha = null; S.tareas = null; S.tareasError = ''; S.verAten = false; S.meta = null; S.liq = null; S.cfgD = null; S.cfgB = null; S.aniosD = null; S.arch = null; S.cfgAnio = 0; S.planAnio = 0; S.verArch = false; S.anioConf = 0; S.modoLista = false; if (S.fa) S.fa.datos = null; tourSalir();
  try { sessionStorage.removeItem('ec_token'); sessionStorage.removeItem('ec_cache'); sessionStorage.removeItem('ec_tour_vis'); } catch (e) { /* sin almacenamiento */ }
}
/** Guarda lo ya cargado para que, al recargar la página, Inicio aparezca al instante y se actualice por detrás. */
function guardarCache() {
  try { if (S.persona && S.cat && S.inicio) sessionStorage.setItem('ec_cache', JSON.stringify({ persona: S.persona, cat: S.cat, inicio: S.inicio })); } catch (e) { /* sin almacenamiento */ }
}
function restaurarCache() {
  try {
    const c = JSON.parse(sessionStorage.getItem('ec_cache') || 'null');
    if (c && c.persona && c.cat && c.inicio && c.inicio.ofertas) { S.persona = c.persona; S.cat = c.cat; S.inicio = c.inicio; S.inicioT = Date.now() - 60000; }
  } catch (e) { /* cache dañada: se ignora */ }
}

/* ---------- vistas ---------- */
function shell(activo, cuerpo) {
  const area = areaDe(activo || hashActual());
  let tabs;
  if (area === 'ext') tabs = [['extension', 'Resumen'], ['planeacion', 'Planeación']];
  else if (area === 'proy') tabs = [['proyectos', 'Por definir']];
  else { tabs = [['inicio', 'Inicio'], ['mis', 'Mis ofertas'], ['tareas', 'Mis tareas'], ['calendario', 'Calendario'], ['nueva', 'Nueva oferta'], ['facturacion', 'Facturación']]; if (puedeCfg()) tabs.push(['configuracion', 'Configuración']); }
  const nomArea = area === 'ext' ? 'Extensión' : area === 'proy' ? 'Proyectos' : 'Educación continua';
  const selector = esLider() ? '<div class="areabar" id="area_sel"><span>Área</span>' + [['ext', '#/extension', 'Extensión'], ['ec', '#/inicio', 'Educación continua'], ['proy', '#/proyectos', 'Proyectos']].map((x) => '<a class="asg' + (x[0] === area ? ' on' : '') + '" href="' + x[1] + '"' + (x[0] === area ? ' aria-current="page"' : '') + '>' + x[2] + '</a>').join('') + '</div>' : '';
  const fl = S.flash ? '<div class="flash ' + S.flash.tipo + '" role="status">' + esc(S.flash.msg) + '</div>' : '';
  return '<header class="top"><div class="brand"><span class="dot"></span><span>Extensión FCS · <b>' + nomArea + '</b></span></div><nav class="nav">' +
    tabs.map((x) => '<a class="tab' + (x[0] === activo ? ' on' : '') + '" href="#/' + x[0] + '">' + x[1] + (x[0] === 'tareas' ? badgeTareas() : '') + '</a>').join('') +
    '</nav><div class="who"><button class="btn q tb" data-tour="boton">▶ Dame mi recorrido virtual</button><span>' + esc(S.persona ? S.persona.nombre : '') + '</span><button class="btn sec" data-act="salir">Salir</button></div></header>' + selector +
    '<main class="wrap">' + fl + cuerpo + '</main>';
}
/** Lista inicial de nombres: la pantalla de ingreso aparece al instante y se actualiza después, sin esperar al servidor. */

  const k = CAT_KEY[cat]; if (!k || !S.fa.datos) return 0;

const faDoc = (id) => (S.fa.datos.docentes.filter((d) => d.id === id)[0]) || null;
function faAlertas(c) {
  const a = [];
  if (!c.orden_interna) a.push('Sin OI');

  if (c.fecha_inicio && c.fecha_fin && c.fecha_fin < c.fecha_inicio) a.push('La fecha de fin es anterior a la de inicio');

/* ---------- tareas: lo que se espera de cada persona en cada oferta ---------- */
const LIDER = 'elisa'; const TRANSVERSAL = 'maribel';
const difDias = (a, b) => Math.round((Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10)) - Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10))) / 86400000);
const hoyStr = () => (S.tareas && S.tareas.hoy) || (S.inicio && S.inicio.hoy ? S.inicio.hoy.slice(0, 10) : '');
const quienTk = (id) => (id === 'sistema' ? 'Sistema' : primerNombre(id));
function ofertaInfo(id) {
  const o = S.inicio && S.inicio.ofertas.filter((x) => x.id === id)[0];
  if (o) return o;
  if (S.ficha && S.fichaId === id) { const f = S.ficha.oferta; return { id, nombre: f.nombre, responsable: f.responsable, apoyos: f.apoyos ? f.apoyos.split(',').filter(Boolean) : [], estado: f.estado, fecha_inicio: f.fecha_inicio, fecha_fin: f.fecha_fin }; }
  return null;
}
const puedeAsignar = (o) => !!o && (S.persona.id === LIDER || S.persona.id === TRANSVERSAL || o.responsable === S.persona.id || (o.apoyos || []).indexOf(S.persona.id) >= 0);
function asignables(o) {
  const ids = [o.responsable].concat(o.apoyos || [], [TRANSVERSAL]);
  return ids.filter((x, i) => x && ids.indexOf(x) === i && S.cat.personas.some((p) => p.id === x));
}
function rolEn(o, id) { return id === o.responsable ? 'responsable' : (o.apoyos || []).indexOf(id) >= 0 ? 'apoyo' : id === TRANSVERSAL ? 'asistente' : ''; }
function opcionesAsignables(o, sel) {
  return '<option value="">Elige…</option>' + asignables(o).map((id) => opcion(id, nombrePersona(id) + (rolEn(o, id) ? ' (' + rolEn(o, id) + ')' : ''), id === sel)).join('');
}
function ofertasAsignables() {
  return S.inicio.ofertas.filter((o) => catEstado(o) !== 'canc' && puedeAsignar(o)).sort((a, b) => ((a.fecha_inicio || '9999') < (b.fecha_inicio || '9999') ? -1 : 1));
}
function tkVence(tk) {
  if (tk.estado === 'Hecha') return { k: 'hecha', txt: 'Hecha' + (tk.completada_en ? ' el ' + fecha(tk.completada_en) : ''), cls: 'v' };
  if (!tk.fecha_limite) return { k: 'sin', txt: 'Sin fecha', cls: 'pd' };
  const d = difDias(tk.fecha_limite.slice(0, 10), hoyStr());
  if (d < 0) return { k: 'venc', d, txt: 'Vencida hace ' + (-d) + (d === -1 ? ' día' : ' días'), cls: 'sr' };
  if (d === 0) return { k: 'hoy', d, txt: 'Vence hoy', cls: 'o' };
  if (d <= 3) return { k: 'p3', d, txt: 'Vence en ' + d + (d === 1 ? ' día' : ' días'), cls: 'o' };
  if (d <= 7) return { k: 'sem', d, txt: 'Vence en ' + d + ' días', cls: 'sa' };
  return { k: 'luego', d, txt: 'En ' + d + ' días', cls: 'g' };
}
function cmpTarea(a, b) {
  const ha = a.estado === 'Hecha' ? 1 : 0; const hb = b.estado === 'Hecha' ? 1 : 0;
  if (ha !== hb) return ha - hb;
  if (ha) return (b.completada_en || '').localeCompare(a.completada_en || '');

function recalcLiq() {

  const todos = C.ingresos.concat(C.gastos);
  const ex = (v) => C.ingresos.reduce((a, c) => a + (v[c[0]] || 0), 0) - C.gastos.reduce((a, c) => a + (v[c[0]] || 0), 0);
  const signo = (d) => (d > 0 ? '+ ' : d < 0 ? '− ' : '') + Math.abs(d).toLocaleString('es-CO');
  let peor = null;
  todos.forEach((c) => {
    const el = document.getElementById('lq_d_' + c[0]); if (!el) return; const ing = el.dataset.ing === '1';
    if (p[c[0]] === undefined || r[c[0]] === undefined) { el.textContent = '—'; el.style.color = ''; el.style.fontWeight = ''; return; }
    const d = r[c[0]] - p[c[0]]; const malo = ing ? d < 0 : d > 0;
    el.textContent = signo(d); el.style.color = d === 0 ? '#4A4766' : malo ? '#B01822' : '#0E6B3F'; el.style.fontWeight = d === 0 ? '400' : '700';
    if (malo && (!peor || Math.abs(d) > peor.v)) peor = { v: Math.abs(d), n: c[1] };
  });
  const completoR = todos.every((c) => r[c[0]] !== undefined); const hayP = todos.some((c) => p[c[0]] !== undefined);
  const ep = ex(p); const er = ex(r);
  const set = (id, txt) => { const e = document.getElementById(id); if (e) e.textContent = txt; };
  set('lq_ep', hayP ? COP(ep) : '—'); set('lq_er', completoR ? COP(er) : '—');
  const ed = document.getElementById('lq_ed'); const av = document.getElementById('lq_aviso');
  if (completoR && hayP) {
    const d = er - ep; if (ed) { ed.textContent = signo(d); ed.style.color = d < 0 ? '#B01822' : d > 0 ? '#0E6B3F' : ''; }
    if (av) {
      const pct = ep !== 0 ? Math.round(100 * Math.abs(d) / Math.abs(ep)) : null;
      av.style.display = 'block';
      if (d < 0) { av.style.background = '#FFF0DB'; av.style.color = '#8F4A00'; av.textContent = 'El excedente real quedó ' + (pct !== null ? pct + ' % ' : '') + 'por debajo del presupuestado' + (peor ? ', sobre todo por «' + peor.n.toLowerCase() + '»' : '') + '.'; }
      else if (d > 0) { av.style.background = '#E3F6EC'; av.style.color = '#0E6B3F'; av.textContent = 'El excedente real superó al presupuestado' + (pct !== null ? ' en ' + pct + ' %' : '') + '.'; }
      else { av.style.background = '#EDEBFA'; av.style.color = '#3F3890'; av.textContent = 'El excedente real coincide con el presupuestado.'; }

const ordenFecha = (a, b) => { const x = a.fecha_inicio || '9999'; const y = b.fecha_inicio || '9999'; return x < y ? -1 : x > y ? 1 : 0; };

function datosMeses() {

  base.forEach((o) => { const m = o.fecha_inicio ? o.fecha_inicio.slice(0, 7) : ''; if (!m) sin.push(o); else if (m < hoyM) antes.push(o); else (porMes[m] = porMes[m] || []).push(o); });
  antes.sort(ordenFecha); sin.sort(ordenFecha); Object.keys(porMes).forEach((k) => porMes[k].sort(ordenFecha));
  const keys = []; let m = hoyM; const ult = Object.keys(porMes).sort().pop() || hoyM; let fin = mesSiguiente(mesSiguiente(hoyM)); if (ult > fin) fin = ult;
  while (m <= fin && keys.length < 24) { keys.push(m); m = mesSiguiente(m); }

async function ruta() {
  if (!S.token) { vistaLogin(); return; }
  const h = (location.hash || '#/inicio').replace(/^#\/?/, '').split('/');
  const que = h[0] || 'inicio';
  if (que === 'oferta' && !h[1]) { location.hash = '#/inicio'; return; }
  if (['inicio', 'mis', 'tareas', 'calendario', 'nueva', 'oferta', 'facturacion', 'extension', 'planeacion', 'configuracion', 'proyectos', 'archivo'].indexOf(que) < 0) { location.hash = '#/inicio'; return; }
  cargando('Cargando…');
  try {
    const tareas = [];
    if (!S.persona) tareas.push(api('sesion').then((r) => { S.persona = r.persona; }));
    if (!S.cat) tareas.push(api('catalogo').then((r) => { S.cat = r; }));
    let refrescar = false;
    if (que === 'inicio' || que === 'mis' || que === 'calendario' || que === 'extension') {
      if (S.precargado && S.inicio) { S.precargado = false; S.inicioT = Date.now(); }
      else if (S.inicio && !S.inicioSucio && S.inicioT && Date.now() - S.inicioT < 600000) { refrescar = Date.now() - S.inicioT > 20000; }
      else tareas.push(api('inicio').then((r) => { S.inicio = r; S.inicioT = Date.now(); S.inicioSucio = false; }));
    }
    if (['planeacion', 'configuracion', 'proyectos', 'archivo'].indexOf(que) >= 0 && !S.inicio) tareas.push(api('inicio').then((r) => { S.inicio = r; S.inicioT = Date.now(); S.inicioSucio = false; }));
    if (que === 'archivo' && puedeCfg()) {
      const ay = Number(h[1]);

      tareas.push(api('inicio', { archivado: ay }).then((r) => { S.arch = { anio: ay, ofertas: r.ofertas }; }));
      S.archAnio = ay;
    }
    if (que === 'oferta') {
      if (S.fichaId !== h[1]) { S.tab = S.tabIr || 'datos'; S.tabIr = ''; const ya = S.inicio && S.inicio.ofertas.filter((o) => o.id === h[1])[0]; cargando(ya ? 'Abriendo «' + ya.nombre + '»…' : 'Abriendo la oferta…'); }
      S.fichaId = h[1];
      tareas.push(api('ficha', { id: h[1] }).then((r) => { S.ficha = r; }));
    }
    if (que === 'tareas') {
      tareas.push(api('tareas').then((r) => { S.tareas = { lista: r.tareas, hoy: r.hoy }; S.tareasError = ''; }));
      if (!S.inicio) tareas.push(api('inicio').then((r) => { S.inicio = r; S.inicioT = Date.now(); }));
    }
    if (que === 'facturacion') {
      tareas.push(api('facturacion').then((r) => { S.fa.datos = r; }));
      if (!S.inicio) tareas.push(api('inicio').then((r) => { S.inicio = r; S.inicioT = Date.now(); }));
    }
    await Promise.all(tareas);
    if (['extension', 'planeacion', 'proyectos'].indexOf(que) >= 0 && S.persona.id !== LIDER) { location.hash = '#/inicio'; return; }
    if (['configuracion', 'archivo'].indexOf(que) >= 0 && !puedeCfg()) { location.hash = '#/inicio'; return; }
    if (que === 'configuracion' || que === 'planeacion') { S.anioConf = 0; await cargarCfg(que); }
    guardarCache();
    S.precargado = false;
    if (que === 'inicio') vistaInicio(); else if (que === 'mis') vistaMis(); else if (que === 'calendario') vistaCalendario(); else if (que === 'extension') vistaExtension();
    else if (que === 'planeacion') vistaPlaneacion(); else if (que === 'configuracion') vistaConfiguracion(); else if (que === 'proyectos') vistaProyectos(); else if (que === 'archivo') vistaArchivo();
    else if (que === 'tareas') vistaTareas(); else if (que === 'nueva') vistaNueva(); else if (que === 'facturacion') { S.fa.edit = ''; S.fa.elim = ''; S.fa.borrador = null; vistaFacturacion(); } else vistaFicha();

  else if (a === 'mes_ir') { if (!document.getElementById('mes_chips')) { irTarjetas(b.dataset.v); return; } S.fx.inicio.mes = b.dataset.v; pintarResultados('inicio'); const c = document.querySelector('.mchip.on'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest', inline: 'center' }); }
  else if (a === 'mes_aten') { if (!document.getElementById('mes_chips')) { irTarjetas('atencion'); return; } S.fx.inicio.mes = 'atencion'; pintarResultados('inicio'); const e = document.getElementById('mes_chips'); if (e && e.scrollIntoView) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (a === 'modo_lista') { S.modoLista = !S.modoLista; vista('inicio'); }
  else if (a === 'cfg_anio') { const n = Number(b.dataset.v); if (b.dataset.k === 'plan') S.planAnio = n; else S.cfgAnio = n; S.anioConf = 0; await recargarCfg(b.dataset.k === 'plan' ? 'planeacion' : 'configuracion'); }
  else if (a === 'anio_hab') { const n = Number(b.dataset.v); if (queActual() === 'planeacion') S.planAnio = n; else S.cfgAnio = n; await opAnios(() => api('habilitarAnio', { anio: n }), n + ' habilitado como proyección, con los valores del año anterior.'); }
  else if (a === 'anio_arch') { S.anioConf = Number(b.dataset.v) || 0; repintarCfg(); const c = document.getElementById('anio_conf'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' }); }
  else if (a === 'anio_arch_ok') { const n = Number(b.dataset.v); if (S.cfgAnio === n) S.cfgAnio = 0; if (S.planAnio === n) S.planAnio = 0; await opAnios(() => api('archivarAnio', { anio: n, confirmar: true }), n + ' quedó archivado. El equipo ya no lo ve; tú puedes consultarlo cuando quieras.'); }
  else if (a === 'anio_vera') { S.verArch = !S.verArch; repintarCfg(); }
  else if (a === 'anio_desarch') { await opAnios(() => api('desarchivarAnio', { anio: Number(b.dataset.v) }), b.dataset.v + ' volvió a estar activo para el equipo.'); }
  else if (a === 'cfg_av_add') {
    const i = document.getElementById('cfg_av_n'); const v = numLq(i ? i.value : ''); const l = S.cfgB.plazos.avisos_antes;
    if (v === null || v > 30) { flash('err', 'Escribe un número de días entre 0 y 30.'); repintarCfg(); return; }
    if (l.indexOf(v) < 0) l.push(v); l.sort((x, y) => y - x); pintarCfgZona();
  }
  else if (a === 'cfg_av_del') { S.cfgB.plazos.avisos_antes.splice(Number(b.dataset.i), 1); pintarCfgZona(); }
  else if (a === 'cfg_rb_add') {
    const t = b.dataset.t; const i = document.getElementById('cfg_rb_' + t); const nom = i ? i.value.trim() : '';
    if (!nom) { if (i) i.focus(); return; }
    if (S.cfgB.rubros[t].some((r) => r.activo !== false && r.nombre.toLowerCase() === nom.toLowerCase())) { flash('err', 'Ese rubro ya existe.'); repintarCfg(); return; }
    S.cfgB.rubros[t].push({ id: '', nombre: nom, activo: true }); pintarCfgZona();
  }
  else if (a === 'cfg_rb_del') { const l = S.cfgB.rubros[b.dataset.t]; if (l.filter((r) => r.activo !== false).length <= 1) { flash('err', 'Debe quedar al menos un rubro.'); repintarCfg(); return; } l.splice(Number(b.dataset.i), 1); pintarCfgZona(); }
  else if (a === 'cfg_nh_add') {
    const f = val('cfg_nh_f'); const n = val('cfg_nh_n').trim();
    if (!f || !n) { flash('err', 'Escribe la fecha y el motivo del día no hábil.'); repintarCfg(); return; }
    if (S.cfgB.no_habiles.dias.some((d) => d.fecha === f)) { flash('err', 'Esa fecha ya está en la lista.'); repintarCfg(); return; }
    S.cfgB.no_habiles.dias.push({ fecha: f, nombre: n }); S.cfgB.no_habiles.dias.sort((x, y) => (x.fecha < y.fecha ? -1 : 1)); pintarCfgZona();
  }
  else if (a === 'cfg_nh_del') { S.cfgB.no_habiles.dias.splice(Number(b.dataset.i), 1); pintarCfgZona(); }
  else if (a === 'cfg_guardar') { await cfgGuardar(); }
  else if (a === 'plan_guardar') { await planGuardar(); }
  else if (a === 'grupo') { S.abiertos[b.dataset.key] = b.getAttribute('aria-expanded') !== 'true'; pintarResultados(b.dataset.ctx); }
  else if (a === 'todos') { const ctx = b.dataset.ctx; const f = S.fx[ctx]; gruposActuales(ctx).forEach((g) => { S.abiertos[ctx + '|' + f.agrupar + '|' + g.k] = b.dataset.v === '1'; }); pintarResultados(ctx); }
  else if (a === 'limpiar') { const ctx = b.dataset.ctx; const alc = S.fx[ctx].alcance; S.fx[ctx] = fxInicial(ctx); S.fx[ctx].alcance = ctx === 'mis' ? 'ambas' : alc; vista(ctx); }
  else if (a === 'prox') { S.verProx = !S.verProx; vistaInicio(); }
  else if (a === 'prox_f') { S.proxFiltro = S.proxFiltro === b.dataset.v ? '' : b.dataset.v; S.verProx = false; vistaInicio(); }
  else if (a === 'aten') { S.verAten = !S.verAten; vistaInicio(); if (S.verAten) { const p = document.getElementById('aten_panel'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
  else if (a === 'calv') { const m = S.fx.inicio.mes; if (S.cal.vista === 'tarjetas' && /^\d{4}-\d{2}$/.test(m)) S.mesCal = m; S.cal.vista = b.dataset.v; vistaCalendario(); }
  else if (a === 'calrol') { S.cal.rol = b.dataset.v; vistaCalendario(); }
  else if (a === 'eq_tareas') { S.ft = Object.assign(ftInicial(), { ver: 'p:' + b.dataset.v, estado: 'pend' }); }
  else if (a === 'eq_cal') { S.cal.persona = b.dataset.v; S.cal.rol = 'todo'; S.cal.vista = 'grid'; }
  else if (a === 'eq_venc') { S.ft = Object.assign(ftInicial(), { ver: 'todas', foco: 'venc' }); location.hash = '#/tareas'; }
  else if (a === 'eq_cert') { S.ft = Object.assign(ftInicial(), { ver: 'todas', foco: 'cert' }); location.hash = '#/tareas'; }
  else if (a === 'eq_liq') { const id = b.dataset.id; S.liq = null; if (S.fichaId === id && S.ficha) { S.tab = 'liq'; S.flash = null; vistaFicha(); location.hash = '#/oferta/' + id; } else { S.tabIr = 'liq'; location.hash = '#/oferta/' + id; } }
  else if (a === 'meta_guardar') { await guardarMeta(); }
  else if (a === 'meta_reint') { S.metaError = ''; cargarMeta(); pintarElisa(); }
  else if (a === 'liq_g' || a === 'liq_e') { await liqGuardar(a === 'liq_e'); }
  else if (a === 'liq_ap') { await liqOp('aprobarLiquidacion', {}, 'Liquidación aprobada: el excedente real ya suma a la meta anual.'); }
  else if (a === 'liq_dv') { const c = val('lq_com').trim(); if (!c) { flash('err', 'Escribe un comentario para devolver la liquidación.'); const y = window.scrollY; vistaFicha(); window.scrollTo(0, y); return; } await liqOp('devolverLiquidacion', { comentario: c }, 'Liquidación devuelta con tu comentario.'); }
  else if (a === 'liq_reint') { S.liqError = ''; vistaFicha(); }
  else if (a === 'tkfoco') { S.ft = Object.assign(ftInicial(), { foco: b.dataset.v }); vistaTareas(); }
  else if (a === 'tkgrupo') { S.abiertos[b.dataset.key] = b.getAttribute('aria-expanded') !== 'true'; pintarTareas(); }
  else if (a === 'tklimpiar') { S.ft = ftInicial(); vistaTareas(); }
  else if (a === 'tkreint') { S.tareasError = ''; repintarTareas(); }
  else if (a === 'tk') { await accionTarea(b); }
  else if (a === 'apoyar') { try { await api('apoyar', { id: b.dataset.id, unirse: b.dataset.u === '1' }); flash('ok', b.dataset.u === '1' ? 'Ahora apoyas esta oferta.' : 'Dejaste de apoyar esta oferta.'); } catch (e) { flash('err', e.message); } ruta(); }
  else if (a === 'tab') { S.tab = b.dataset.v; S.flash = null; vistaFicha(); }
  else if (a === 'estado') {
    const atras = b.dataset.atras === '1';
    await conAviso(() => api('cambiarEstado', { id: S.fichaId, estado: b.dataset.v, motivo: atras ? val('m_atras') : '' }), 'Estado actualizado.', (r) => { S.ficha = r.ficha; });
  } else if (a === 'confirmar') {
    await conAviso(() => api('confirmarEstado', { id: S.fichaId, estado: val('c_estado') }), 'Estado confirmado.', (r) => { S.ficha = r.ficha; });
  } else if (a === 'aplazar') {
    await conAviso(() => api('aplazar', { id: S.fichaId, motivo: val('ap_motivo'), nueva_fecha: val('ap_fecha') }), 'La oferta quedó aplazada.', (r) => { S.ficha = r.ficha; });
  } else if (a === 'reactivar') {
    await conAviso(() => api('reactivar', { id: S.fichaId, estado: val('re_estado') }), 'La oferta fue reactivada.', (r) => { S.ficha = r.ficha; });
  } else if (a === 'cancelar') {
    await conAviso(() => api('cambiarEstado', { id: S.fichaId, estado: 'Cancelado', motivo_cancelacion: val('m_canc') }), 'La oferta quedó cancelada.', (r) => { S.ficha = r.ficha; });
  } else if (a === 'item') {
    const lista = S.ficha.checklist; const it = lista.filter((x) => x.id_item === b.dataset.item)[0];
    if (!it || it.estado === b.dataset.v) return;
    const antes = it.estado; it.estado = b.dataset.v; S.inicioSucio = true; repintarSuave();
    escribirOptimista(() => api('guardarItem', { id: S.fichaId, idItem: b.dataset.item, estado: b.dataset.v }), () => { it.estado = antes; });
  } else if (a === 'mover') {
    const lista = S.ficha.checklist; const i = lista.findIndex((x) => x.id_item === b.dataset.item); const j = i + (b.dataset.d === 'subir' ? -1 : 1);
    if (i < 0 || j < 0 || j >= lista.length) return;
    const copia = lista.slice(); const tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp; S.inicioSucio = true; repintarSuave();
    escribirOptimista(() => api('moverItem', { id: S.fichaId, idItem: b.dataset.item, direccion: b.dataset.d }), () => { S.ficha.checklist = copia; });
  } else if (a === 'archivar') {
    await conAviso(() => api('archivarNota', { id: S.fichaId, idNota: b.dataset.nota }), 'Nota archivada.', (r) => { S.ficha.notas = r.notas; });
  }
});
app.addEventListener('change', async (ev) => {
  const e = ev.target;
  if (e.id === 'lver') { const c = document.getElementById('lc'); if (c) c.type = e.checked ? 'text' : 'password'; return; }
  if (e.dataset && e.dataset.lq) { const v = numLq(e.value); e.value = v === null ? '' : v.toLocaleString('es-CO'); recalcLiq(); return; }
  if (e.dataset && e.dataset.cal) { S.cal[e.dataset.cal] = e.value; if (e.dataset.cal === 'persona') S.cal.rol = 'todo'; vistaCalendario(); return; }
  if (e.dataset && e.dataset.ft && e.dataset.ft !== 'q') { S.ft[e.dataset.ft] = e.value; S.ft.foco = ''; vistaTareas(); return; }
  if (e.dataset && e.dataset.tk === 'fecha') { const tk = S.tareas.lista.filter((x) => x.id === e.dataset.id)[0]; if (tk && e.value && e.value !== (tk.fecha_limite || '').slice(0, 10)) tkGuardar(tk, { fecha_limite: e.value }); return; }
  if (e.id === 'tk_of' && e.tagName === 'SELECT') { const o = ofertaInfo(e.value); const a = document.getElementById('tk_a'); if (a) a.innerHTML = o ? opcionesAsignables(o, '') : '<option value="">Primero elige la oferta</option>'; return; }
  if (e.dataset && e.dataset.plan) { const v = numLq(e.value); e.value = v === null ? '' : v.toLocaleString('es-CO'); return; }
  if (e.dataset && e.dataset.fx && e.dataset.fx !== 'q') { const ctx = e.dataset.ctx; S.fx[ctx][e.dataset.fx] = e.type === 'checkbox' ? e.checked : e.value; if (ctx === 'inicio' && e.dataset.fx === 'resp') S.fx.inicio.mes = 'auto'; pintarResultados(ctx); return; }
  if (e.dataset && e.dataset.chg === 'obs') {
    const it = S.ficha.checklist.filter((x) => x.id_item === e.dataset.item)[0]; if (!it) return;
    const antes = it.observacion; it.observacion = e.value; S.inicioSucio = true;
    escribirOptimista(() => api('guardarItem', { id: S.fichaId, idItem: e.dataset.item, observacion: e.value }), () => { it.observacion = antes; }, true);
  }
});
app.addEventListener('input', (ev) => {
  const e = ev.target;
  if (e.dataset && e.dataset.lq) { recalcLiq(); return; }
  if (e.dataset && e.dataset.ft === 'q') { S.ft.q = e.value; S.ft.foco = ''; pintarTareas(); return; }
  if (e.dataset && e.dataset.cfg) { cfgSet(e.dataset.cfg, e.value); return; }
  if (e.dataset && e.dataset.plan) { planSet(e.dataset.plan, e.value); return; }
  if (e.dataset && e.dataset.fx === 'q') { S.fx[e.dataset.ctx].q = e.value; if (e.dataset.ctx === 'inicio') S.fx.inicio.mes = 'auto'; pintarResultados(e.dataset.ctx); }
});
const avisoMayus = (ev) => {
  if (ev.target && ev.target.id === 'lc' && ev.getModifierState) {
    const a = document.getElementById('lcaps'); if (a) a.style.display = ev.getModifierState('CapsLock') ? 'block' : 'none';
  }
};
app.addEventListener('keydown', avisoMayus);
app.addEventListener('keyup', avisoMayus);
window.addEventListener('hashchange', ruta);
ruta();
</script>
